[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "skilleval"
version = "0.1.0"
description = "Declarative, file-based tests for LLM setups and their components"
requires-python = ">=3.12"
dependencies = [
    "pyyaml>=6"
]

[project.optional-dependencies]
dev = [
    "pytest>=8", 
    "pytest-cov>=5", 
    "ruff>=0.6", 
    "mypy>=1.11", 
    "types-PyYAML"
]

[project.scripts]
skilleval = "skilleval.cli:main"

[tool.mypy]
strict = true
files = ["src"]

[tool.ruff.lint]
select = ["E4", "E7", "E9", "F", "I"]
