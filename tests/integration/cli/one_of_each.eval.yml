# One test per status, in file order: passed, failed, error, skipped (needs the failed one).
root: pyproject.toml
tests:
  p:
    kind: static-check
    prompt: {file: docs/x.md}
    lint: [chars]
  f:
    kind: static-check
    prompt: {file: docs/x.md}
    constraints:
      - contains: Usage
  e:
    kind: static-check
    prompt: {file: docs/missing.md}
    lint: [chars]
  s:
    kind: static-check
    needs: f
    prompt: {file: docs/x.md}
    lint: [chars]
