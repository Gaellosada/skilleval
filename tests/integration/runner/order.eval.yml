# File order is dependent, other, base; `dependent` needs `base`, so base comes first.
root: pyproject.toml
tests:
  dependent:
    kind: static-check
    needs: base
    prompt: docs/x.md
    lint: [chars]
  other:
    kind: static-check
    prompt: docs/x.md
    lint: [chars]
  base:
    kind: static-check
    prompt: docs/x.md
    lint: [chars]
