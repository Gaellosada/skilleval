# Reusable templates. Any file name; other files pull them in with `uses`.
# A template holds checks, or a setup, model, budget, task and expectations, and no target; the test that uses it names its own.
# A path in a template resolves against this file, so ./ paths are relative to it.

templates:

  house_style:
    kind: static-check
    lint:
      - chars
      - markdown_links
    constraints:
      - words:
          max: 400
      - urls:
          default: deny
          except: [docs.anthropic.com, github.com]

  posix_only:
    kind: static-check
    lint:
      - paths_exist
    constraints:
      - paths:
          style: posix
          except: ["path/to/**", "<**>"]

  reviewer:                                # a reusable setup, model and budget
    kind: evaluation
    setup:
      harness: user_local                  # the harness installed on this machine
      override_system_prompt:
        file: ./prompts/reviewer.md       # a file holding the system prompt
      working_folder: ./fixtures/pr-42     # copied for the run, never modified
    model: claude-opus-5-5
    max_tokens: 200000                     # for the whole test
    max_budget_usd: 5                      # likewise; whichever is hit first stops and fails the test

  tests_first:                             # a task run before the test's own
    kind: evaluation
    setup:
      harness: user_local
      working_folder: ./fixtures/utils
    model: claude-sonnet-5
    task: Write pytest tests for utils.py.
    expect:                                # checked right after this task, before the test's
      - response:
          - contains_any: [pytest, test]
