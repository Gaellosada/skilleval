# Reusable templates. Any file name; other files pull them in with `uses`.
# A template holds checks, or a setup, model and budget, and no target; the test that uses it names its own.
# A path in a template resolves against this file, so ./ paths are relative to it.

templates:

  house_style:
    kind: static-check
    lint:
      - chars
      - markdown_links
    constraints:
      - words:
          max: 400
      - urls:
          default: deny
          except: [docs.anthropic.com, github.com]

  posix_only:
    kind: static-check
    lint:
      - paths_exist
    constraints:
      - paths:
          style: posix
          except: ["path/to/**", "<**>"]

  reviewer:                                # a reusable setup, model and budget
    kind: evaluation
    setup:
      system_prompt:
        file: ./prompts/reviewer.md       # a file holding the system prompt
      working_folder: ./fixtures/pr-42     # copied for the run, never modified
    model: claude-opus-5-5
    max_tokens: 200000                     # for the whole test; beyond it, the test fails
