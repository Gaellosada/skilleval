# One test file, showing every evaluation feature, with the templates it uses in shared-templates.eval.yml.
# Paths resolve from the project root found via `root`, unless prefixed with ./ (relative to this file);
# a `with_path` under `expect` is relative to the workspace the model worked in, as are a judge's `files`,
# and a `run` works in a copy of it.

root: pyproject.toml

judge_defaults:                          # the judge of every `judge` block of this file, over the defaults
  model: claude-opus-5-5
  harness: blank                         # the same judge for every user, whatever the test's harness
  max_budget_usd: 0.5                    # for one judge, outside the test's limits

tests:

  reviewer-prompt:                       # a static check to gate the evaluations on
    kind: static-check
    prompt:
      file: ./prompts/reviewer.md
    lint: [chars]

  review:                                # the template, overridden key by key
    kind: evaluation
    needs: reviewer-prompt               # no tokens spent on a broken prompt
    uses: ./shared-templates.eval.yml#reviewer
    model: claude-sonnet-5               # replaces the template's model
    setup:
      working_folder: ./fixtures/pr-43   # replaces the folder, keeps the rest of the setup
    expect:                              # no task beside it: checked on the template's
      - response:
          - contains_any: [bug, issue]
          - words:
              max: 300
              severity: error            # this check only, over the section's warn
        severity: warn                   # the whole section

  implement:                             # the template's task runs first, then this one
    kind: evaluation
    uses: ./shared-templates.eval.yml#tests_first
    setup:
      skills:                            # added to the harness's own skills
        - .claude/skills/refactor        # relative to the project root
        - ./fixtures/skills/fake-deploy  # relative to this file
    task: Implement slugify in utils/strings.py so that tests/test_strings.py passes.
    expect:                              # on this task; the template's stays on its own
      - file:
          with_path: utils/strings.py    # must exist
          matches:
            patterns: ['^def slugify\(']   # single quotes keep the backslash as written
          lines:
            max: 200
      - file:
          with_path: tests/test_strings.py  # the tests were not switched off to pass
          matches_none:
            patterns: ['pytest\.mark\.(skip|xfail)']
      - file:
          with_path: utils/__init__.py   # only has to exist
      - file:
          with_path: NOTES.md
          severity: warn                 # the whole block, existence included
          lines:
            max: 50
      - run: python -m pytest -q         # the tests pass, run in a copy of the workspace
      - run: python -m pytest -q "$SKILLEVAL_FILE_DIR/hidden"   # tests the model never saw, beside this file
        timeout: 120                     # seconds, 600 unless set
      - judge: Does slugify lower-case its input before replacing the spaces?   # a closed question, for a model
        require: YES                     # the answer that passes, YES or NO
        files: [utils/strings.py]        # given to the judge, which sees nothing else of the workspace
        can_see_task: false              # the file alone is judged
        can_see_response: false
        effort: low                      # this judge only, over the default, high
        max_tokens: 50000                # likewise, over the default, 100000

  explain:                               # no template, and an empty workspace
    kind: evaluation
    setup:
      harness: user_local
      override_system_prompt: |          # the system prompt itself, inline
        You teach physics to beginners.
        Be brief.
    model: claude-haiku-4-5-20251001
    task: Explain me quantum computing.  # as a user would type it
    expect:
      - response:                        # constraint entries, as in a static check
          - contains: [qubit, superposition]
          - contains_none: ["I cannot", "I'm unable"]
          - words:
              min: 100
              max: 600
          - words:
              max: 400
              severity: warn             # a soft budget beside the hard one
          - code:
              count: {max: 0}            # prose only
      - judge: Is every statement about quantum computing in the reply true?   # sees the task and the reply
        require: YES
      - judge: Does the reply use a term of physics without explaining it?
        require: NO
        severity: warn                   # reported, never failing
    max_tokens: 100000                   # a token limit alone, no budget in dollars
