# One test file, showing the evaluation features, with the templates it uses in shared-templates.eval.yml.
# Paths resolve from the project root found via `root`, unless prefixed with ./ (relative to this file);
# a `path` under `expect` is relative to the workspace the model worked in.

root: pyproject.toml

tests:

  reviewer-prompt:                       # a static check to gate the evaluations on
    kind: static-check
    prompt:
      file: ./prompts/reviewer.md
    lint: [chars]

  review:                                # everything but the task from the template
    kind: evaluation
    needs: reviewer-prompt               # no tokens spent on a broken prompt
    uses: ./shared-templates.eval.yml#reviewer
    task: Review the patch in pr.diff.   # the template holds none, so the test brings it

  review-on-sonnet:                      # the template, overridden key by key
    kind: evaluation
    needs: reviewer-prompt
    uses: ./shared-templates.eval.yml#reviewer
    task: Review the patch in pr.diff.
    model: claude-sonnet-5               # replaces the template's model
    setup:
      working_folder: ./fixtures/pr-43   # replaces the folder, keeps the rest of the setup

  implement:                             # the template's task runs first, then this one
    kind: evaluation
    uses: ./shared-templates.eval.yml#tests_first
    task: Implement slugify in utils/strings.py so that tests/test_strings.py passes.
    expect:                              # on this task; the template's expect stays on its own
      - file:
          path: utils/strings.py         # relative to the workspace; must exist
          matches:
            patterns: ['^def slugify\(']
          lines:
            max: 200
      - file:
          path: tests/test_strings.py    # the tests were not switched off to pass
          matches_none:
            patterns: ['pytest\.mark\.(skip|xfail)']
      - response:
          - contains_none: ["I cannot", "I'm unable"]

  review-inline:                         # no template
    kind: evaluation
    setup:
      harness: user_local                # required in every setup
      override_system_prompt: |          # the system prompt itself, inline
        You review Python pull requests.
        Be brief.
      skills:                            # added to the user's own skills
        - .claude/skills/refactor        # relative to the project root
        - ./fixtures/skills/fake-deploy  # relative to this file
      working_folder: ./fixtures/pr-42
    model: claude-sonnet-5
    task: Review the patch in pr.diff for bugs and style issues.
    expect:
      - response:
          - words:
              max: 300
        severity: warn                   # the whole section: reported, never fails
    max_budget_usd: 0.50                 # a budget in dollars alone, no token limit

  review-appended:                       # the harness's own system prompt, with a line added
    kind: evaluation
    setup:
      harness: user_local
      append_system_prompt: Answer in French.   # exclusive with override_system_prompt
      working_folder: ./fixtures/utils
    model: claude-sonnet-5
    task: Explain what this repository does.
    max_tokens: 100000

  review-bare:                           # the harness's own system prompt, an empty workspace
    kind: evaluation
    setup:
      harness: user_local
    model: claude-haiku-4-5-20251001
    task: Explain me quantum computing.   # a raw prompt, as a user would type it
    expect:
      - response:                        # constraint entries, as in a static check
          - contains: [qubit, superposition]
          - contains_none: ["I cannot", "I'm unable"]
          - words:
              min: 100
              max: 600
          - words:
              max: 400
              severity: warn             # this check only: a soft budget beside the hard one
          - code:
              count: {max: 0}            # prose only
    max_tokens: 100000                   # every token counts, the harness's own system prompt included
