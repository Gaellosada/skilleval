# One test file, showing every static feature.
# Paths resolve from the project root found via `root`, unless prefixed with ./ (relative to this file).

name: Skill house style
skilleval_version: ">=0.4"
root: pyproject.toml                     # without it, only ./ paths would be allowed

tests:

  shared-rules:                          # the checks come from templates
    kind: static-check
    prompt:
      include: .claude/skills/**/SKILL.md
    uses:
      - ./shared-templates.eval.yml#house_style
      - ./shared-templates.eval.yml#posix_only

  skills:
    kind: static-check
    name: Every skill file                # optional, shown in reports
    prompt:                              # a glob, with exclusions on top
      include: .claude/skills/**/SKILL.md
      exclude: "**/fixtures/**"
    format: anthropic-skill

    lint:
      - paths_exist:
          severity: warn                 # reported, never fails the run

    constraints:

      # size of the prompt
      - words:
          min: 50
          max: 600
      - words:                           # a soft budget beside the hard one
          max: 400
          severity: warn                 # the default everywhere is `error`
      - lines:
          max: 120

      # words that must or must not appear
      - contains: Usage                  # shorthand for a single word
      - contains:
          words: [Usage, Examples]       # each of them, 1 to 3 times
          occurrences:
            min: 1
            max: 3
      - contains_any:
          words: [test, tests, pytest]   # at least one, twice in total
          occurrences:
            min: 2
      - contains_none:
          words: ./banned-words.txt      # one per line, from a file beside this one
          case_sensitive: true

      # the same three, with regexes
      - matches:
          patterns: ["^## [A-Z]"]
      - matches_any:
          patterns: ["pytest -q", "uv run"]
      - matches_none:
          patterns: ["TODO", "FIXME"]

      # code blocks: bash and python only, untagged rejected, at most 8
      - code:
          default: deny
          except: [bash, python]
          count:
            max: 8

  root-instructions:
    kind: static-check
    prompt: CLAUDE.md
    format: anthropic-claude
    lint: [chars, markdown_links]
    constraints:
      - words:
          max: 2000
