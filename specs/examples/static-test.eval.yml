# One test file, showing every static feature, with the templates it uses in shared-templates.eval.yml.
# Paths resolve from the project root found via `root`, unless prefixed with ./ (relative to this file).

root: pyproject.toml                     # without it, only ./ paths would be allowed

tests:

  skills:
    kind: static-check
    prompt:                              # one case per matched file
      include: .claude/skills/**/SKILL.md
      exclude: ["**/fixtures/**", "**/drafts/**"]
    uses:                                # their checks are added to those below
      - ./shared-templates.eval.yml#house_style
      - ./shared-templates.eval.yml#posix_only
    format:
      anthropic-skill:
        severity: warn                   # reported, never fails the run; the default is `error`
    lint:
      - paths_exist:                     # also in posix_only: the test's severity wins
          severity: warn
    constraints:

      # size of the prompt
      - words:                           # also in house_style: this max replaces its 400
          max: 600
      - lines:
          max: 120

      # words that must or must not appear
      - contains: Usage                  # shorthand for a single word
      - contains:
          words: [Examples, Notes]       # each of them exactly once
          occurrences: 1
      - contains_any:
          words: [test, tests, pytest]   # twice or more in total
          occurrences:
            min: 2
      - contains_none:
          words: ./banned-words.txt      # one per line, from a file beside this one
          case_sensitive: true

      # the same three, with regexes
      - matches:
          patterns: ["^## [A-Z]"]
      - matches_any:
          patterns: ["pytest -q", "uv run"]
      - matches_none:
          patterns: ["TODO", "FIXME"]

      # code blocks: bash and untagged only, at most 8
      - code:
          default: deny
          except: [bash, not_specified]
          count:
            max: 8

  root-instructions:
    kind: static-check
    needs: skills                        # skipped unless every case of skills passed
    prompt:
      file: CLAUDE.md
    format: anthropic-claude
    lint: [chars, markdown_links]

  inline:
    kind: static-check
    prompt: |                            # the prompt itself, inline: one case, no file behind it
      You review Python pull requests.
      Be brief.
    constraints:
      - urls:
          count: {max: 0}                # no URL at all
